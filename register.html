<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | DriveEase</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="auth">
<div class="auth-panel">
<a class="brand" href="login.html">Drive<span>Ease</span></a>
<span class="eyebrow">CUSTOMER REGISTRATION</span>
<h1>Create account.</h1>
<p>Enter your details to create a customer account.</p>

<form id="registerForm">
<label>Name
<input id="registerName" type="text" autocomplete="name" placeholder="Enter your name" required>
</label>

<label>Phone Number
<input id="registerPhone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="14" placeholder="Enter 10-digit phone number" required>
</label>

<label>Password
<input id="registerPassword" type="password" autocomplete="new-password" placeholder="Create password" required>
</label>

<label>Confirm Password
<input id="registerConfirm" type="password" autocomplete="new-password" placeholder="Confirm password" required>
</label>

<button class="btn primary" type="submit">Register</button>
<p id="registerError" class="hint" style="color:#c62828;display:none"></p>
</form>

<a class="btn ghost full" href="login.html">Back to Login</a>
</div>
</main>
<script src="js/script.js"></script>
</body>
</html>
