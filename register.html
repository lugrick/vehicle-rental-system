<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Create Account | DriveEase</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="auth"><div class="auth-panel"><a class="brand" href="login.html">Drive<span>Ease</span></a><span class="eyebrow">CREATE ACCOUNT</span><h1>Join DriveEase.</h1><p>Create your customer account using your phone number.</p>
<form id="registerForm">
<label>Name<input id="registerName" type="text" autocomplete="name" placeholder="Enter your name" required></label>
<label>Phone Number<input id="registerPhone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="15" placeholder="Enter phone number" required></label>
<label>Password<input id="registerPassword" type="password" autocomplete="new-password" placeholder="Create a password" required></label>
<label>Confirm Password<input id="registerConfirm" type="password" autocomplete="new-password" placeholder="Confirm your password" required></label>
<button class="btn primary" type="submit">Create Account</button>
<p id="registerError" class="hint" style="color:#c62828;display:none"></p>
</form>
<a class="btn ghost full" href="login.html">Already have an account? Login</a>
</div></main><script src="js/script.js"></script></body></html>
