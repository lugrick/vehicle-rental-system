<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | DriveEase</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="auth">
<div class="auth-panel">
<a class="brand" href="index.html">Drive<span>Ease</span></a>
<h1>Login</h1>

<form id="loginForm">
<label>Phone Number
<input id="loginPhone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="Enter phone number" required>
</label>

<label>Password
<input id="loginPassword" type="password" autocomplete="current-password" placeholder="Enter password" required>
</label>

<button class="btn primary full" type="submit">Login</button>
<p id="loginError" class="hint" style="color:#c62828;display:none"></p>
</form>

<p class="auth-switch">Don't have an account? <a href="register.html">Create Account</a></p>
<button class="btn ghost full admin-entry" id="adminLogin" type="button">Admin Login</button>
</div>
</main>
<script src="js/script.js"></script>
</body>
</html>
